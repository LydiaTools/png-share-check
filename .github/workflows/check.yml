name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/package.cjs
      - run: npm run test:browser
        env:
          PNG_CHECK_APP_ROOT: dist
          PNG_CHECK_RUN_DIR: runs/packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: runs/
          retention-days: 7
